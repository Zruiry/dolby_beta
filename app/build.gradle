/**
 * 应用模块构建配置
 * 适配AGP 8.10.0变更：
 * - compileSdkVersion → compileSdk
 * - minSdkVersion/targetSdkVersion → minSdk/targetSdk
 * - lintOptions → lint
 * - 新增namespace声明（AGP 8.x必须）
 * - 升级compileSdk和buildToolsVersion
 */
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

Properties props = new Properties()
props.load(new FileInputStream(file("signing.properties")))

android {
    // AGP 8.x要求必须声明namespace，替代AndroidManifest.xml中的package属性
    namespace 'com.raincat.dolby_beta'
    // compileSdk 36（libxposed API 101的service依赖要求compileSdk 36+）
    compileSdk 36

    defaultConfig {
        applicationId "com.raincat.dolby_beta"
        // AGP 8.x新语法：minSdk替代minSdkVersion
        // 升级到26，libxposed service依赖要求minSdk 26+
        minSdk 26
        // AGP 8.x新语法：targetSdk替代targetSdkVersion
        targetSdk 34
        versionCode 358
        versionName "3.5.4.zr4"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // AGP 8.x默认关闭BuildConfig生成，项目使用了buildConfigField，需要手动启用
    buildFeatures {
        buildConfig true
        // 启用 Jetpack Compose（用于设置界面美化）
        compose true
    }

    // Compose 编译器版本（Kotlin 1.9.25 → Compose Compiler 1.5.15）
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    // AGP 8.x中extractNativeLibs应从AndroidManifest移到此处
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // libxposed API 101需要META-INF/xposed/配置文件的合并规则

    signingConfigs {
        release{
            keyAlias props['KEY_ALIAS']
            keyPassword props['KEY_PASSWORD']
            storeFile file(props['KEYSTORE_FILE'])
            storePassword props['KEYSTORE_PASSWORD']
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "LOG_DEBUG", "true" //显示log
        }
        release {
            buildConfigField "boolean", "LOG_DEBUG", "false" //不显示log
            shrinkResources false //资源压缩
            // 必须启用R8代码压缩，否则libxposed API类会被打包进DEX
            // LSPosed检测到API类来自模块ClassLoader时会拒绝加载模块
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all {
        variant ->
            variant.outputs.all {
                //只处理生产版本
                if (buildType.name == 'release') {
                    def createTime = new Date().format("YYYYMMdd", TimeZone.getTimeZone("GMT+08:00"))
                    // app包名称
                    outputFileName = "dolby_beta_" + defaultConfig.versionName + "_" + createTime + "-" + buildType.name + ".apk"
                }
            }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // AGP 8.x中lintOptions已废弃，使用lint替代
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    // Modern libxposed API 102（替代Legacy API de.robv.android.xposed:api:82）
    // 必须使用compileOnly，否则API类会被打包进APK导致LSPosed拒绝加载
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'com.annimon:stream:1.2.2'
    implementation 'org.smali:dexlib2:2.3.4'
    implementation 'com.google.guava:guava:28.2-android'
    implementation 'com.google.code.gson:gson:2.8.9'
    // Kotlin标准库
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // ===== Jetpack Compose（用于设置界面美化）=====
    // Compose BOM 统一管理 Compose 库版本
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    // Material 3 组件库（Switch / Surface / Card 等）
    implementation 'androidx.compose.material3:material3'
    // Compose 核心 UI 运行时与工具
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // Compose 与 Android 互操作（ComponentDialog 等）
    implementation 'androidx.activity:activity-compose:1.9.0'
}

// ============================================================================
// 日志说明
// ============================================================================
// Debug 版本在设备端自动将日志写入文件（LogUtils.init()），路径为：
//   /sdcard/Android/data/{网易云包名}/files/dolby/dolby.log
// 分析日志时通过 adb pull 命令拉取到项目 logs/dolby.log：
//   adb pull /sdcard/Android/data/com.netease.cloudmusic/files/dolby/dolby.log logs/dolby.log
